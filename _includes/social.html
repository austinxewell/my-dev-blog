{% comment %}

    <a href="{{ site.portfolio_url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; margin-right: 12px; text-decoration: none; color: #0A66C2;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#bfbcbc" style="margin-right: 4px;">
        <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/>

  {% endif %}

      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#bfbcbc" style="margin-right: 4px;">
